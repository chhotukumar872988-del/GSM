<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GSM~MAHAKAL Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><header><a href="index.html">← View website</a><strong>GSM<span>~</span>MAHAKAL <small>ADMIN</small></strong><button id="reset" class="quiet">Reset changes</button></header><main><div class="notice">This editor saves on this device/browser. Export a backup after editing; import it on the browser used to manage the site.</div><form id="admin-form"><section><h1>Website editor</h1><p>Update every visible text, button link, tool and driver card.</p><div class="form-grid"><label>Brand name<input name="brand" required></label><label>Hero label<input name="eyebrow" required></label><label class="wide">Hero description<textarea name="hero" required></textarea></label><label>WhatsApp link<input name="whatsapp" type="url" required></label><label>Telegram link<input name="telegram" type="url" required></label><label>YouTube link<input name="youtube" type="url" required></label><label>Footer text<input name="footer" required></label></div></section><section><h2>Support banner</h2><div class="form-grid"><label>Small label<input name="serviceLabel" required></label><label>Title<input name="serviceTitle" required></label><label class="wide">Description<textarea name="serviceCopy" required></textarea></label></div></section><section><div class="section-title"><h2>Tools</h2><button type="button" id="add-tool">+ Add tool</button></div><div id="tools-editor" class="item-editor"></div></section><section><div class="section-title"><h2>Drivers</h2><button type="button" id="add-driver">+ Add driver</button></div><div id="drivers-editor" class="item-editor"></div></section><div class="actions"><button class="primary" type="submit">Save changes</button><button class="quiet" type="button" id="export">Export backup</button><label class="import">Import backup<input id="import" type="file" accept="application/json"></label></div></form></main><script src="data.js"></script><script src="admin.js"></script></body></html>
